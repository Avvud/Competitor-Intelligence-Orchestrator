[build-system]
requires = ["setuptools>=68", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "competitor-intel"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "sqlalchemy>=2.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "beautifulsoup4>=4.12",
    "extruct>=0.17",
    "feedparser>=6.0",
    "mcp>=1.0",
    "python-pptx>=1.0",
    "reportlab>=4.2",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
]

[project.optional-dependencies]
# Install for running tests (M0 onwards)
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "freezegun>=1.5",
    "pytest-cov>=5.0",
]
# Install only when starting M7 dashboard
dashboard = [
    "streamlit>=1.35",
]
# Install only when starting M4 analysis — WARNING: ~2 GB download (PyTorch)
vectors = [
    "sentence-transformers>=3.0",
]
# Install only when starting M3 dynamic page connectors
browser = [
    "playwright>=1.44",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
